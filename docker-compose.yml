# Levanta todo el sistema:  docker compose up --build
# Solo el gateway publica un puerto; el resto vive en la red interna.

services:
  gateway:
    build: .
    container_name: api_gateway
    restart: always
    command: python src/gateway/gateway.py
    ports: "8080:8080"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:password@db:5104/api_db
      - SECRET_KEY=f649e631eb0a87e23b0d478151c463e5e60d7c09a0657e90db8f88174388ac0f3807c0f3d698963b381c20ddd4d6d1a3aca4798ba9e4077d71c5706b24c91b4e
      - PORT=8080
    depends_on: [bff, api_db]

  bff:
    build: .
    command: python src/bff/bff.py
    depends_on: [orquestador]

  orquestador:
    build: .
    command: python src/orquestador/orquestador.py
    depends_on: [inventario, transportista, tracking]

  inventario:
    build: .
    command: python src/servicios/main.py
    ports:
      - "5001:5001"

    depends_on: [inventario_db]
    
  transportista:
    build: .
    command: python src/servicios/transportista.py
    depends_on: [transportista_db]

  tracking:
    build:
      context: ./src/servicios/tracking
      dockerfile: Dockerfile
    container_name: tracking
    restart: always
    environment:
      - DATABASE_URL=postgresql://tracking_user:tracking_password@tracking-db:5432/tracking_db
    depends_on:
      tracking-db:
        condition: service_healthy

  inventario_db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: inventario, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    volumes: [inventario_data:/var/lib/postgresql/data]

  transportista_db:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: transportista, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    volumes: [transportista_data:/var/lib/postgresql/data]

  tracking-db:
    image: postgres:15-alpine
    container_name: tracking-db
    restart: always
    environment:
      POSTGRES_USER: tracking_user
      POSTGRES_PASSWORD: tracking_password
      POSTGRES_DB: tracking_db
    volumes:
      - tracking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking_user -d tracking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  inventario_data:
  transportista_data:
  tracking_data:
  api_data:
